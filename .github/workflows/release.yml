name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            skills/photo-story-magazine/scripts/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate
        env:
          PYTHONUTF8: '1'
        run: python scripts/check.py --test
      - name: Build tagged release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --out dist --expected-tag "$RELEASE_TAG"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Travelogue Editor $RELEASE_TAG" --notes-file CHANGELOG.md
